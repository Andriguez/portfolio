services:
  db:
    image: mysql:8
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://portfolio_user:${MYSQL_PASSWORD}@db:3306/portfolio
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRASH_REPO: ${TRASH_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads_data:/app/uploads, cv_data:/app/cv_files]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    depends_on: [backend]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  cv_data:
  caddy_data:
  caddy_config: